name: OSS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      extended_validation:
        description: Run the 100,000-record backup/restore soak
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install --editable ".[dev]"
      - name: Test package
        working-directory: .
        run: python -m pytest
      - name: Ten-thousand-record completeness and restore gate
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: >-
          python ./tools/soak_workspace.py
          --pages 1000 --executions 10 --verify-backup
          --max-seconds 180 --max-python-peak-mib 512 --max-rss-mib 1024
      - name: Hundred-file compaction and completeness gate
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: >-
          python ./tools/soak_workspace.py
          --pages 100 --executions 100
          --max-seconds 240 --max-python-peak-mib 512 --max-rss-mib 1024
      - name: Large-record completeness gate
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: >-
          python ./tools/soak_workspace.py
          --pages 1000 --executions 2 --payload-bytes 32768
          --max-seconds 240 --max-python-peak-mib 768 --max-rss-mib 1536
      - name: Static lint
        run: python -m ruff check --select E9,F63,F7,F82 .

  minimum-dependencies:
    name: Declared minimum dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install declared minimum runtime and test dependencies
        run: |
          python -m pip install --upgrade pip 'setuptools==84.0.0'
          python -m pip install \
            'aiohttp==3.14.5' 'selectolax==0.3.10' 'httpx==0.27.0' \
            'duckdb==1.2.0' 'pyarrow==17.0.0' 'croniter==2.0.0' \
            'pytz==2024.1' 'pytest==9.0.3' 'pytest-asyncio==1.3.0' \
            'pytest-cov==5.0.0' 'keyring==25.0.0'
          python -m pip install --no-deps --editable .
      - name: Audit dependency floor including transitive dependencies
        run: |
          python -m pip freeze --exclude-editable > /tmp/dependency-floor.txt
          python -m venv /tmp/audit-tools
          /tmp/audit-tools/bin/python -m pip install --upgrade pip pip-audit
          # Arrow C++ prebuffer API is not exposed by Python bindings:
          # https://github.com/advisories/GHSA-rgxp-2hwp-jwgg
          /tmp/audit-tools/bin/python -m pip_audit \
            --disable-pip --no-deps -r /tmp/dependency-floor.txt \
            --ignore-vuln CVE-2026-25087 --progress-spinner off
      - name: Test against dependency floor
        run: python -m pytest ./tests

  extended-load:
    name: Optional 100,000-record validation
    if: github.event_name == 'workflow_dispatch' && inputs.extended_validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install workspace runtime
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install --editable ".[dev]"
      - name: Validate every record through compaction and restore
        run: >-
          python ./tools/soak_workspace.py
          --pages 10000 --executions 10 --verify-backup
          --max-seconds 900 --max-python-peak-mib 1024 --max-rss-mib 2048

  hardened-container:
    name: Rootless hardened container acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build local scheduler image
        run: >-
          docker build
          --file ./Dockerfile
          --tag pulsecrawl-oss:validation .
      - name: Validate rootless and read-only operation
        shell: bash
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' pulsecrawl-oss:validation)" = "pulsecrawl"
          workspace="${RUNNER_TEMP}/container-workspace"
          mkdir -p "${workspace}"
          chmod 0777 "${workspace}"
          common=(
            --cap-drop ALL
            --security-opt no-new-privileges
            --read-only
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m
            --volume "${workspace}:/workspace"
          )
          docker run --rm "${common[@]}" pulsecrawl-oss:validation \
            init /workspace --name "Container validation"
          docker run --rm "${common[@]}" pulsecrawl-oss:validation \
            --workspace /workspace health --readiness
          container=$(docker run --detach "${common[@]}" pulsecrawl-oss:validation \
            --workspace /workspace schedule start --poll-seconds 0.1)
          sleep 2
          docker stop --timeout 10 "${container}"
          test "$(docker inspect --format '{{.State.ExitCode}}' "${container}")" = "0"
          docker rm "${container}"

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install release tools
        run: python -m pip install --upgrade pip setuptools build twine pip-audit cyclonedx-bom
      - name: Build distributions
        run: |
          python scripts/export-oss.py --output "${RUNNER_TEMP}/distribution-source"
          python -m build --sdist --wheel --outdir "$PWD/dist" "${RUNNER_TEMP}/distribution-source"
          python -m twine check dist/*
          python scripts/check-distributions.py dist
          unzip -l dist/*.whl | grep '.dist-info/licenses/LICENSE'
          tar -tzf dist/*.tar.gz | grep '/LICENSE$'
      - name: Clean-install smoke test
        run: |
          python -m venv "${RUNNER_TEMP}/smoke"
          "${RUNNER_TEMP}/smoke/bin/python" -m pip install --upgrade pip setuptools
          "${RUNNER_TEMP}/smoke/bin/python" -m pip install 'dist/'*.whl duckdb pyarrow croniter pytz
          "${RUNNER_TEMP}/smoke/bin/pulsecrawl" init "${RUNNER_TEMP}/workspace" --name "CI smoke"
          "${RUNNER_TEMP}/smoke/bin/pulsecrawl" --workspace "${RUNNER_TEMP}/workspace" validate
      - name: Audit runtime environment
        run: |
          "${RUNNER_TEMP}/smoke/bin/python" -m pip check
          smoke_site=$("${RUNNER_TEMP}/smoke/bin/python" -c 'import site; print(site.getsitepackages()[0])')
          python -m pip_audit --path "${smoke_site}" --progress-spinner off
          cyclonedx-py environment "${RUNNER_TEMP}/smoke/bin/python" \
            --output-format JSON --output-file sbom.json
      - name: Check source boundary and tracked secrets
        run: |
          python scripts/check-secrets.py
          python scripts/export-oss.py --output "${RUNNER_TEMP}/public-source"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oss-distributions-and-sbom
          path: |
            dist
            sbom.json
          if-no-files-found: error

  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Export public source
        run: python scripts/export-oss.py --output "${RUNNER_TEMP}/pulsecrawl-public"
      - name: Verify public documentation links
        run: python scripts/check-doc-links.py "${RUNNER_TEMP}/pulsecrawl-public"
      - name: Verify exported repository can validate its own boundary
        shell: bash
        run: |
          git -C "${RUNNER_TEMP}/pulsecrawl-public" init --quiet
          git -C "${RUNNER_TEMP}/pulsecrawl-public" add --all
          (
            cd "${RUNNER_TEMP}/pulsecrawl-public"
            python scripts/export-oss.py \
              --output "${RUNNER_TEMP}/pulsecrawl-public-reexport" \
              --allow-dirty
          )
      - name: Verify excluded hosted paths
        run: |
          test ! -e "${RUNNER_TEMP}/pulsecrawl-public/config"
          test ! -e "${RUNNER_TEMP}/pulsecrawl-public/infra"
          test ! -e "${RUNNER_TEMP}/pulsecrawl-public/src/firebase"
          test ! -e "${RUNNER_TEMP}/pulsecrawl-public/src/dataplane"
          test ! -e "${RUNNER_TEMP}/pulsecrawl-public/src/apps"

  release-ready:
    name: Release validation complete
    if: always()
    needs: [test, minimum-dependencies, hardened-container, distribution, public-boundary]
    runs-on: ubuntu-latest
    steps:
      - name: Require all mandatory validation jobs to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          if not results or any(job['result'] != 'success' for job in results.values()):
              raise SystemExit('Mandatory OSS validation failed or was skipped')
          PY
