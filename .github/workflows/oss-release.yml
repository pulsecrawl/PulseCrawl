name: Prepare and publish OSS release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build only, TestPyPI only, or TestPyPI then approved PyPI
        type: choice
        options: [build, testpypi, pypi]
        default: build
        required: true
      release_tag:
        description: Existing reviewed tag, e.g. v0.1.0 (required to upload)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: oss-release-${{ inputs.release_tag || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      actions: read
    # Uploads can only originate from the public repository's main workflow.
    if: inputs.target == 'build' || (github.repository == 'pulsecrawl/PulseCrawl' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate dispatch before checking out release code
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TARGET: ${{ inputs.target }}
        run: |
          python - <<'PY'
          import os, re
          tag = os.environ['RELEASE_TAG']
          if tag or os.environ['RELEASE_TARGET'] != 'build':
              if not re.fullmatch(r'v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)', tag):
                  raise SystemExit('Uploads require an existing vX.Y.Z release tag')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Require reviewed release ancestry and consistent metadata
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            git merge-base --is-ancestor HEAD origin/main
            python scripts/check-release.py --tag "$RELEASE_TAG"
          else
            python scripts/check-release.py
          fi
          python scripts/check-secrets.py
      - name: Require successful full CI for this exact release commit
        if: inputs.target != 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ inputs.target }}
        run: python scripts/check-release-ci.py --sha "$(git rev-parse HEAD)" --target "$RELEASE_TARGET"
      - name: Export the public source boundary
        run: python scripts/export-oss.py --output "${RUNNER_TEMP}/pulsecrawl-public"
      - name: Test the exported release
        working-directory: ${{ runner.temp }}/pulsecrawl-public
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e '.[dev]'
          python -m pytest
          python -m ruff check src tests examples scripts
          python scripts/check-doc-links.py
      - name: Build sdist, then build the wheel from that sdist
        working-directory: ${{ runner.temp }}/pulsecrawl-public
        run: |
          python -m build --sdist --outdir dist .
          mkdir "${RUNNER_TEMP}/sdist-source"
          tar -xzf dist/*.tar.gz -C "${RUNNER_TEMP}/sdist-source"
          python -m build --wheel --outdir "$PWD/dist" "${RUNNER_TEMP}/sdist-source/"*
          python -m twine check --strict dist/*
          python scripts/check-distributions.py dist
      - name: Clean-install base and workspace extras (no source-tree imports)
        working-directory: ${{ runner.temp }}/pulsecrawl-public
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/smoke"
          smoke_python="${RUNNER_TEMP}/smoke/bin/python"
          "$smoke_python" -m pip install --upgrade pip
          wheels=("$PWD"/dist/*.whl)
          "$smoke_python" -m pip install "${wheels[0]}"
          env -u PYTHONPATH "$smoke_python" -I scripts/smoke-distribution.py
          "$smoke_python" -m pip check
          "$smoke_python" -m pip install "${wheels[0]}[workspace]"
          env -u PYTHONPATH "$smoke_python" -I scripts/smoke-distribution.py --workspace
          "${RUNNER_TEMP}/smoke/bin/pulsecrawl" --help
          "$smoke_python" -m pip check
      - name: Read validated version for index verification
        working-directory: ${{ runner.temp }}/pulsecrawl-public
        id: version
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re
          version = re.search(r'^__version__\s*=\s*"([^"]+)"', Path('src/pulsecrawl/__init__.py').read_text(), re.M).group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oss-release-candidates
          path: ${{ runner.temp }}/pulsecrawl-public/dist/*
          if-no-files-found: error
          retention-days: 14

  testpypi:
    needs: build
    if: inputs.target != 'build'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pulsecrawl/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oss-release-candidates
          path: dist
      - name: Publish identical candidate archives to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  verify-testpypi:
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oss-release-candidates
          path: dist
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Download exact TestPyPI wheel without resolving dependencies there
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m pip download --index-url https://test.pypi.org/simple/ \
            --no-deps --no-cache-dir --only-binary=:all: \
            --dest test-download "pulsecrawl==${PACKAGE_VERSION}"
          cmp dist/*.whl test-download/*.whl
      - name: Install verified wheel with dependencies from production PyPI only
        shell: bash
        run: |
          wheels=(test-download/*.whl)
          python -m pip install "${wheels[0]}[workspace]"
          python -m pip check
          mkdir smoke-source
          tar -xzf dist/*.tar.gz -C smoke-source
          env -u PYTHONPATH python -I smoke-source/*/scripts/smoke-distribution.py --workspace
          pulsecrawl --help

  pypi:
    needs: [build, verify-testpypi]
    if: inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pulsecrawl/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oss-release-candidates
          path: dist
      - name: Publish TestPyPI-verified artifacts after environment approval
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
