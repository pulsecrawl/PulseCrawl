[project]
name = "pulsecrawl"
dynamic = ["version"]
description = "PulseCrawl crawler and SDK: run locally or submit hosted jobs through the PulseCrawl API."
readme = {file = "PYPI_README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "PulseCrawl contributors"}]
keywords = ["crawler", "scraping", "sdk", "robots", "parquet", "duckdb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "aiohttp>=3.14.5,<4",
    "httpx>=0.27,<1",
    "selectolax>=0.3.10,<0.5",
]

[project.urls]
Source = "https://github.com/pulsecrawl/PulseCrawl"
Documentation = "https://github.com/pulsecrawl/PulseCrawl#readme"
Changelog = "https://github.com/pulsecrawl/PulseCrawl/blob/main/CHANGELOG.md"
Issues = "https://github.com/pulsecrawl/PulseCrawl/issues"
Security = "https://github.com/pulsecrawl/PulseCrawl/security/policy"

[project.optional-dependencies]
sql = [
    "duckdb>=1.2",
    "pytz>=2024.1",
]
workspace = [
    "duckdb>=1.2",
    "pyarrow>=17.0",
    "croniter>=2.0",
    "pytz>=2024.1",
]
cloud = [
    "keyring>=25.0",
]
dev = [
    "setuptools>=84.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3",
    "pytest-cov>=5.0",
    "duckdb>=1.2",
    "pyarrow>=17.0",
    "croniter>=2.0",
    "pytz>=2024.1",
    "ruff>=0.14,<1",
    "keyring>=25.0",
]

[project.scripts]
pulsecrawl = "pulsecrawl.cli:main"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "_build_backend"
backend-path = ["."]

[tool.setuptools.dynamic]
version = {attr = "pulsecrawl.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=pulsecrawl --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["src/pulsecrawl"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
